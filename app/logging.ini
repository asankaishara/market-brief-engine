[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=universalFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=universalFormatter
args=(sys.stdout,)

[formatter_universalFormatter]
format=%(asctime)s | %(levelname)-8s | [%(filename)s] | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

